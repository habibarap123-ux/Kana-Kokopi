<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard Owner · Kana &amp; Kokopi</title>
<style>
  :root{--green:#1f4d2f;--green-d:#14291b;--gold:#d4b062;--bg:#f4f1ea;--card:#fff;--ink:#1c1c1a;--mut:#6b6b63;--line:#e6e1d4;--kana:#1f4d2f;--kokopi:#c58b3a;--bad:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1511;--card:#18211b;--ink:#ecebe4;--mut:#9aa396;--line:#2a362d;--kana:#4f9a69;--kokopi:#d9a24f}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
  body{padding:env(safe-area-inset-top,0) 0 calc(24px + env(safe-area-inset-bottom,0))}
  header{position:sticky;top:0;z-index:5;background:var(--green-d);color:#fff;padding:calc(10px + env(safe-area-inset-top,0)) 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
  header h1{font-size:17px;margin:0;flex:1}
  header small{display:block;font-weight:400;font-size:11px;opacity:.75}
  header button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:8px 11px;font-size:16px;cursor:pointer}
  main{max-width:880px;margin:0 auto;padding:12px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1.5px solid var(--green);background:transparent;color:var(--green);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--green);color:#fff}
  @media (prefers-color-scheme:dark){.chip{border-color:var(--kana);color:var(--kana)}.chip.on{background:var(--kana);color:#0f1511}}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
  .kpi{background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
  .kpi.big{grid-column:1/-1;background:var(--green);color:#fff;border:0}
  .kpi small{display:block;font-size:12px;color:var(--mut)}
  .kpi.big small{color:rgba(255,255,255,.75)}
  .kpi b{display:block;font-size:20px;margin-top:2px}
  .kpi.big b{font-size:28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:15px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line);font-size:14px}
  .row:last-child{border-bottom:0}
  .mut{color:var(--mut);font-size:12px}
  .badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:8px;padding:2px 7px;margin-right:6px;vertical-align:1px}
  .b-Kana{background:var(--kana)}.b-Kokopi{background:var(--kokopi)}
  .bar{height:7px;border-radius:4px;background:var(--line);margin:6px 0 2px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px}
  .cab{padding:10px 0;border-bottom:1px solid var(--line)}
  .cab:last-child{border-bottom:0}
  .cab .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .cab .sub{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:2px}
  .chart{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:16px}
  .chart .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .chart .stk{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
  .chart small{font-size:10px;color:var(--mut);margin-top:4px;white-space:nowrap}
  .chart .v{font-size:9px;color:var(--mut)}
  .sisa-r{padding:10px 0;border-bottom:1px solid var(--line)}
  .sisa-r:last-child{border-bottom:0}
  .sisa-r .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .sisa-r .mut{margin-top:1px}
  .pil{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .pil span{font-size:12.5px;border-radius:12px;padding:3px 10px;background:var(--line);color:var(--ink)}
  .pil span b{font-weight:800}
  .pil span.low{background:#fde8e6;color:#8c1d18}
  .pil span.hab{background:var(--bad);color:#fff}
  @media (prefers-color-scheme:dark){.pil span.low{background:#4a2420;color:#ffb4ab}}
  .stale{display:inline-block;font-size:11px;font-weight:700;background:#fff3cd;color:#5a4400;border-radius:8px;padding:2px 7px;margin-left:6px}
  .legend{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
  details{border-bottom:1px solid var(--line);padding:8px 0}
  details:last-child{border-bottom:0}
  summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;font-size:14px}
  summary::-webkit-details-marker{display:none}
  .det{font-size:13px;color:var(--mut);line-height:1.6;margin-top:6px}
  .det b{color:var(--ink)}
  .msg{text-align:center;padding:36px 18px;color:var(--mut)}
  .box{max-width:420px;margin:30px auto;padding:0 14px}
  .box .card{padding:18px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
  input[type=text],input[type=password]{width:100%;font-size:16px;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit}
  input:focus{outline:none;border-color:var(--green)}
  .btn{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;background:var(--green);color:#fff}
  .btn.alt{background:transparent;color:var(--green);border:2px solid var(--green)}
  @media (prefers-color-scheme:dark){.btn{background:var(--kana);color:#0f1511}.btn.alt{background:transparent;color:var(--kana);border-color:var(--kana)}}
  .err{color:var(--bad);font-size:13px;margin-top:8px}
  .warn{background:#fff3cd;color:#5a4400;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:10px}
  @media (prefers-color-scheme:dark){.warn{background:#3a3114;color:#f0dc9a}}
  em.dl{font-style:normal;font-size:11px;font-weight:700;margin-left:6px;padding:1px 6px;border-radius:8px;background:rgba(128,128,128,.2);color:inherit}
  em.dl.g{background:#d6f0de;color:#14582d}em.dl.b{background:#fbd9d5;color:#8c1d18}
  .kpi small.vs{margin-top:2px;font-size:12px}
  .ins p{margin:7px 0;font-size:14px;line-height:1.5}
  .ins p:first-of-type{margin-top:0}
  .lst .row small{display:block;color:var(--mut);font-size:12px}
  .mini{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
  .rr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dotted var(--line);font-size:14px}
  .chart small .cw{display:block;font-size:11px;line-height:1.2}
  @media (min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.kpi.big{grid-column:span 2}}
  input,select,textarea{font-size:16px !important}
  html,body,button,a,input,select,label{touch-action:manipulation}
</style>
</head>
<body>
<header>
  <h1>📊 Dashboard Owner<small id="sub">Kana &amp; Kokopi</small></h1>
  <button onclick="O.muat(true)" title="Muat ulang" aria-label="Muat ulang">⟳</button>
  <button onclick="O.setup()" title="Pengaturan" aria-label="Pengaturan">⚙️</button>
</header>
<main id="app"></main>

<script>
(function(){
  "use strict";
  var LS = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set: function(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
    del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
  };
  var PANTRY_BAWAAN = "a5e94d54fa021b342a0db708";
  var FB_URL = "https://kana-kokopi-default-rtdb.asia-southeast1.firebasedatabase.app";
  var kodeTersimpan = LS.get("owner_pantry");
  var cfg = { pantry: (kodeTersimpan && /^[0-9a-f]{24}$/.test(kodeTersimpan)) ? kodeTersimpan : PANTRY_BAWAAN };
  var hapusTgl = {};
  var rows = [], periode = "hari", brand = "semua", upd = null, demo = false, galat = "", loading = false, timer = null;
  var app = document.getElementById("app");
  var AUTH_KEY = "";   // isi Web API Key Firebase untuk mengaktifkan login owner (email + password)
  var LAT = 0.5071, LON = 101.4478, KOTA = "Pekanbaru";
  var cuaca = {}, piutangList = [], sembunyi = {}, semuaRider = [], token = "", tokenExp = 0, rtok = LS.get("owner_rt") || "";
  var rslug = function(b, c){ return (b + "-" + c).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); };
  function urlFb(p){ return FB_URL + "/d/" + encodeURIComponent(cfg.pantry) + p + ".json" + (token ? "?auth=" + encodeURIComponent(token) : ""); }
  function errAuth(){ var e = new Error("auth"); e.status = 401; return e; }
  function masuk(email, pw){
    return fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + AUTH_KEY, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({email: email, password: pw, returnSecureToken: true})})
      .then(function(r){ return r.json().then(function(j){
        if(!r.ok) throw new Error("login");
        token = j.idToken; rtok = j.refreshToken; LS.set("owner_rt", rtok); LS.set("owner_email", email); tokenExp = Date.now() + (Number(j.expiresIn) || 3600) * 1000 - 60000;
      }); });
  }
  function segarkan(){
    if(!AUTH_KEY) return Promise.resolve();
    if(token && Date.now() < tokenExp) return Promise.resolve();
    if(!rtok) return Promise.reject(errAuth());
    return fetch("https://securetoken.googleapis.com/v1/token?key=" + AUTH_KEY, {method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"}, body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(rtok)})
      .then(function(r){ return r.json().then(function(j){
        if(!r.ok){ LS.del("owner_rt"); rtok = ""; token = ""; throw errAuth(); }
        token = j.id_token; rtok = j.refresh_token; LS.set("owner_rt", rtok); tokenExp = Date.now() + (Number(j.expires_in) || 3600) * 1000 - 60000;
      }); });
  }

  /* ---------- cuaca (Open-Meteo, gratis, tanpa kunci) ---------- */
  function muatCuaca(){
    var u = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON + "&daily=weather_code,precipitation_sum,temperature_2m_max&hourly=precipitation&past_days=92&forecast_days=2&timezone=Asia%2FJakarta";
    fetch(u).then(function(r){ if(!r.ok) throw new Error("cuaca"); return r.json(); }).then(function(j){
      var d = j.daily || {}, h = j.hourly || {}, out = {};
      (d.time || []).forEach(function(t, i){ out[t] = {code: d.weather_code[i], mm: d.precipitation_sum[i] || 0, tmax: d.temperature_2m_max[i], jam: []}; });
      (h.time || []).forEach(function(t, i){
        var tg = t.slice(0, 10), hr = Number(t.slice(11, 13));
        if(out[tg] && hr >= 9 && hr <= 21 && (h.precipitation[i] || 0) >= 0.3) out[tg].jam.push(hr);
      });
      cuaca = out; if(rows.length && !demo) tampil();
    }).catch(function(){});
  }
  function cInfo(c){
    var k = c.code, e = "☀️", n = "Cerah";
    if(k >= 95){ e = "⛈️"; n = "Badai petir"; }
    else if(k >= 80){ e = "🌧️"; n = "Hujan deras sesaat"; }
    else if(k >= 61){ e = "🌧️"; n = k >= 65 ? "Hujan lebat" : "Hujan"; }
    else if(k >= 51){ e = "🌦️"; n = "Gerimis"; }
    else if(k >= 45){ e = "🌫️"; n = "Berkabut"; }
    else if(k === 3){ e = "☁️"; n = "Berawan"; }
    else if(k >= 1){ e = "🌤️"; n = "Cerah berawan"; }
    return {e: e, n: n};
  }
  function hujan(t){ var c = cuaca[t]; return !!c && (c.mm >= 2 || c.jam.length >= 2); }
  function rentangJam(a){
    var out = [], s = a[0], p = a[0];
    for(var i = 1; i <= a.length; i++){
      if(i < a.length && a[i] === p + 1){ p = a[i]; continue; }
      out.push(pad(s) + ".00–" + pad(p + 1) + ".00"); if(i < a.length){ s = a[i]; p = a[i]; }
    }
    return out.join(", ");
  }
  function ringkasCuaca(t){
    var c = cuaca[t]; if(!c) return "";
    var i = cInfo(c);
    return i.e + " " + i.n + (c.jam.length ? " · hujan jam " + rentangJam(c.jam) : "") + " · " + Math.round(c.tmax) + "°C · curah hujan " + c.mm.toFixed(1) + " mm";
  }
  function emojiCuaca(t){ return cuaca[t] ? cInfo(cuaca[t]).e : ""; }

  /* ---------- perbandingan periode ---------- */
  function rentangSebelum(){
    var t = new Date(), s = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    if(periode === "hari"){ var k = new Date(s); k.setDate(k.getDate() - 1); return [key(k), key(k), "kemarin"]; }
    var n = periode === "7" ? 7 : periode === "30" ? 30 : 0;
    if(n){ var e = new Date(s); e.setDate(e.getDate() - n); var b = new Date(e); b.setDate(b.getDate() - n + 1); return [key(b), key(e), n + " hari sebelumnya"]; }
    if(periode === "bulan"){
      var a = new Date(t.getFullYear(), t.getMonth() - 1, 1), maks = new Date(t.getFullYear(), t.getMonth(), 0).getDate();
      return [key(a), key(new Date(t.getFullYear(), t.getMonth() - 1, Math.min(t.getDate(), maks))), "bulan lalu (tanggal sama)"];
    }
    return null;
  }
  function saringPrev(){
    var r = rentangSebelum(); if(!r) return null;
    return rows.filter(function(x){ return x.tgl >= r[0] && x.tgl <= r[1] && (brand === "semua" || x.brand === brand); });
  }
  function delta(now, prev, naikBaik){
    if(!prev) return "";
    var p = Math.round((now - prev) / prev * 100);
    if(p === 0) return '<em class="dl">sama</em>';
    var naik = p > 0, cls = naikBaik === null ? "" : (naik === naikBaik ? " g" : " b");
    return '<em class="dl' + cls + '">' + (naik ? "▲" : "▼") + Math.abs(p) + '%</em>';
  }

  var rp = function(n){ return "Rp " + Math.round(n || 0).toLocaleString("id-ID"); };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var pad = function(n){ return String(n).padStart(2, "0"); };
  var key = function(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var jamL = function(h){ h = Number(h); return ((h % 12) || 12) + (h < 12 ? "a" : "p"); };
  var jam12 = function(d){ var h = d.getHours(); return ((h % 12) || 12) + "." + pad(d.getMinutes()) + " " + (h >= 12 ? "PM" : "AM"); };
  var tglPendek = function(k){ return new Date(k + "T00:00:00").toLocaleDateString("id-ID", {day: "numeric", month: "short"}); };
  var tglPanjang = function(k){ return new Date(k + "T00:00:00").toLocaleDateString("id-ID", {weekday: "short", day: "numeric", month: "short"}); };

  function kemarinKey(){ var t = new Date(); return key(new Date(t.getFullYear(), t.getMonth(), t.getDate() - 1)); }
  function mulaiPeriode(){
    var t = new Date(), s = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    if(periode === "hari") return key(s);
    if(periode === "7"){ s.setDate(s.getDate() - 6); return key(s); }
    if(periode === "30"){ s.setDate(s.getDate() - 29); return key(s); }
    if(periode === "bulan") return key(new Date(t.getFullYear(), t.getMonth(), 1));
    return "";
  }
  function saring(){
    var a = mulaiPeriode();
    return rows.filter(function(r){ return r.tgl >= a && (brand === "semua" || r.brand === brand); });
  }
  function jumlah(list, f){ return list.reduce(function(s, r){ return s + (Number(r[f]) || 0); }, 0); }
  function gabungMap(list, f){
    var m = {};
    list.forEach(function(r){ var o = r[f] || {}; Object.keys(o).forEach(function(k){ m[k] = (m[k] || 0) + (Number(o[k]) || 0); }); });
    return m;
  }

  /* ---------- tampilan ---------- */
  function tampilSetup(){
    app.innerHTML =
      '<div class="box"><div class="card"><h3>🔐 Kode sinkron</h3>' +
      '<p class="mut">Isi sekali saja. Data tersimpan di HP ini.</p>' +
      '<label>Kode sinkron</label><input type="text" id="fPan" placeholder="contoh: 1a2b3c4d-5e6f-..." value="' + esc(cfg.pantry) + '" autocomplete="off" autocapitalize="off">' +
      (galat ? '<div class="err">' + esc(galat) + '</div>' : '') +
      '<button class="btn" onclick="O.simpanCfg()">Simpan &amp; Buka</button>' +
      (cfg.pantry ? '<button class="btn alt" style="color:var(--bad);border-color:var(--bad)" onclick="O.resetKemarin()">🗑 Reset data kemarin (' + tglPendek(kemarinKey()) + ')</button>' +
        (Object.keys(hapusTgl).length ? '<p class="mut" style="margin:10px 0 0">Tanggal yang sudah direset: ' + Object.keys(hapusTgl).sort().map(tglPendek).join(", ") + '</p>' : '') : '') +
      '</div>' + kartuRider() + (AUTH_KEY && rtok ? '<button class="btn alt" onclick="O.keluar()">Keluar akun</button>' : '') + '</div>';
    document.getElementById("sub").textContent = "Pengaturan";
  }

  function sisaCard(){
    var hariIni = key(new Date()), per = {};
    rows.forEach(function(r){
      if(brand !== "semua" && r.brand !== brand) return;
      var k = r.brand + "|" + r.cabang;
      if(!per[k] || r.tgl > per[k].tgl) per[k] = r;
    });
    var ks = Object.keys(per).map(function(k){ return per[k]; }).sort(function(a, b){
      if(a.tgl !== b.tgl) return a.tgl < b.tgl ? 1 : -1;
      return a.cabang < b.cabang ? -1 : 1;
    });
    if(!ks.length) return "";
    var total = {}, totCup = 0;
    var h = '<div class="card"><h3>📦 Sisa stok per rider</h3><p class="mut" style="margin:-4px 0 4px">Posisi terakhir yang dikirim tiap rider (tidak terpengaruh pilihan periode). Merah = tinggal 3 atau kurang.</p>';
    ks.forEach(function(r){
      var sisa = r.sisa || {}, nama = Object.keys(sisa).filter(function(n){ return sisa[n] > 0; }).sort(function(a, b){ return sisa[a] - sisa[b]; });
      var habis = Object.keys(r.menu || {}).filter(function(n){ return (r.menu[n] || 0) > 0 && !(sisa[n] > 0); }).sort();
      var cup = nama.reduce(function(s, n){ return s + sisa[n]; }, 0);
      nama.forEach(function(n){ total[n] = (total[n] || 0) + sisa[n]; }); totCup += cup;
      var kapan = r.upd ? new Date(r.upd) : null;
      h += '<div class="sisa-r"><div class="top"><span><span class="badge b-' + esc(r.brand) + '">' + esc(r.brand) + '</span><b>' + esc(r.cabang) + '</b>' +
        (r.tgl !== hariIni ? '<span class="stale">data ' + tglPendek(r.tgl) + '</span>' : '') + '</span><b>' + cup + ' cup</b></div>' +
        '<div class="mut">' + (kapan && !isNaN(kapan) ? 'Diperbarui ' + jam12(kapan) + (key(kapan) !== hariIni ? ' · ' + tglPendek(key(kapan)) : '') : 'Waktu tidak diketahui') + '</div>' +
        '<div class="pil">' +
        (nama.length || habis.length ? nama.map(function(n){ return '<span class="' + (sisa[n] <= 3 ? "low" : "") + '">' + esc(n) + ' <b>' + sisa[n] + '</b></span>'; }).join("") +
          habis.map(function(n){ return '<span class="hab">' + esc(n) + ' habis</span>'; }).join("") : '<span>Tidak ada sisa</span>') +
        '</div></div>';
    });
    var tk = Object.keys(total).sort(function(a, b){ return total[b] - total[a]; });
    if(ks.length > 1 && tk.length){
      h += '<div class="sisa-r"><div class="top"><b>Total semua rider</b><b>' + totCup + ' cup</b></div><div class="pil">' +
        tk.map(function(n){ return '<span>' + esc(n) + ' <b>' + total[n] + '</b></span>'; }).join("") + '</div></div>';
    }
    return h + '</div>';
  }

  function kpi(l, v, big, d, vs){ return '<div class="kpi' + (big ? " big" : "") + '"><small>' + l + (d || "") + '</small><b>' + v + '</b>' + (vs ? '<small class="vs">' + vs + '</small>' : '') + '</div>'; }
  function chip(grp, val, label, aktif){ return '<button class="chip' + (aktif ? " on" : "") + '" onclick="O.' + grp + '(\'' + val + '\')">' + label + '</button>'; }

  function kartuCuaca(list){
    if(!Object.keys(cuaca).length) return "";
    var h = '<div class="card"><h3>🌦️ Cuaca ' + KOTA + '</h3>', t = key(new Date());
    if(periode === "hari"){

        var cup = Math.round((14 + rnd() * 22) * c[2]), omz = cup * 12000, qris = Math.round(omz * (0.3 + rnd() * 0.2) / 1000) * 1000, bon = rnd() < 0.4 ? 12000 * Math.round(1 + rnd() * 2) : 0;
        var mn = {}, left = cup; menu.forEach(function(m, k){ var q = k === menu.length - 1 ? left : Math.min(left, Math.round(cup * rnd() * 0.4)); mn[m] = q; left -= q; });
        var jm = {}; for(var hh = 9; hh <= 21; hh++){ jm[hh] = Math.round(rnd() * cup / 5); }
        out.push({tgl: key(d), brand: c[0], cabang: c[1], omzet: omz, cup: cup, trx: Math.round(cup * 0.7), tunai: omz - qris - bon, qris: qris, bon: bon, pinjam: rnd() < 0.3 ? 10000 : 0, keluar: rnd() < 0.3 ? 5000 : 0, pelT: 0, pelQ: 0, promoC: 0, promoN: 0, bonusC: 0, rusakC: 0, menu: mn, jam: jm, sisa: i === 0 ? {"Kopi Susu": 3, "Americano": 2} : {}});
      });
    }
    return out;
  }

  function tulisReset(fn){
    return segarkan().then(function(){ return ambilJson(urlFb("/owner-reset")).catch(function(){ return {}; }); }).then(function(c){
      c = c || {}; var o = {hapus: Object.assign({}, c.hapus), rider: Object.assign({}, c.rider)}; fn(o);
      return fetch(urlFb("/owner-reset"), {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(o)});
    }).then(function(r){ if(!r.ok) throw new Error("gagal"); });
  }
  /* ---------- aksi ---------- */
  window.O = {
    per: function(v){ periode = v; tampil(); },
    brd: function(v){ brand = v; tampil(); },
    muat: muat,
    setup: function(){ demo = false; galat = ""; tampilSetup(); },
    simpanCfg: function(){
      var p = document.getElementById("fPan").value.trim();
      if(p.length < 20){ galat = "Kode sinkron belum benar."; tampilSetup(); return; }
      cfg.pantry = p; LS.set("owner_pantry", p); galat = ""; rows = []; demo = false; muat(true);
    },
    contoh: function(){ demo = true; galat = ""; muat(); },
    resetKemarin: function(){
      var k = kemarinKey();
      var n = rows.filter(function(r){ return r.tgl === k; }).length;
      if(!confirm("Reset data kemarin (" + tglPanjang(k) + ")?\n\n" + (n ? n + " catatan harian (semua rider, Kana dan Kokopi) " : "Semua catatan tanggal itu ") + "akan hilang dari dashboard ini di semua HP owner dan tidak akan muncul lagi, walau rider mengirim ulang.\n\nTidak bisa dibatalkan.")) return;
      tulisReset(function(o){ o.hapus[k] = Date.now(); }).then(function(){
        rows = rows.filter(function(x){ return x.tgl !== k; }); hapusTgl[k] = 1; galat = ""; demo = false; loading = false; muat(true);
      }).catch(function(){ galat = "Gagal mereset. Periksa internet lalu coba lagi."; tampilSetup(); });
    },
    sembunyiRider: function(slug){
      var r = semuaRider.filter(function(x){ return x.slug === slug; })[0]; if(!r) return;
      if(!confirm("Sembunyikan rider " + r.cabang + " (" + r.brand + ") dari dashboard?\n\nData tidak dihapus, dan bisa ditampilkan lagi lewat ⚙️.")) return;
      tulisReset(function(o){ o.rider[slug] = {n: r.brand + " · " + r.cabang, t: Date.now()}; }).then(function(){ loading = false; muat(true); setTimeout(tampilSetup, 600); }).catch(function(){ galat = "Gagal menyimpan. Periksa internet."; tampilSetup(); });
    },
    tampilRider: function(slug){
      tulisReset(function(o){ delete o.rider[slug]; }).then(function(){ loading = false; muat(true); setTimeout(tampilSetup, 600); }).catch(function(){ galat = "Gagal menyimpan. Periksa internet."; tampilSetup(); });
    },
    login: function(){
      var em = document.getElementById("fEm").value.trim(), pw = document.getElementById("fPw").value;
      if(!em || !pw){ galat = "Isi email dan password."; tampilLogin(); return; }
      masuk(em, pw).then(function(){ galat = ""; loading = false; muat(true); }).catch(function(){ galat = "Email atau password salah."; tampilLogin(); });
    },
    keluar: function(){ LS.del("owner_rt"); rtok = ""; token = ""; rows = []; galat = ""; tampilLogin(); }
  };

  if(/[?&]demo\b/.test(location.search)){ demo = true; }
  muat(); muatCuaca(); setInterval(muatCuaca, 30 * 60000);
  timer = setInterval(function(){ if(!document.hidden && !demo && cfg.pantry) muat(false); }, 60000);
})();
</script>
